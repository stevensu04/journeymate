<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="JourneyMate — plan less, experience more. A mobile trip planner prototype with AI travel suggestions." />
    <meta name="theme-color" content="#ff8a2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JourneyMate" />
    <meta property="og:title" content="JourneyMate" />
    <meta property="og:description" content="Plan less, experience more." />
    <meta property="og:image" content="assets/icon-512.png" />
    <title>JourneyMate</title>
    <link rel="icon" type="image/png" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth">
    <div class="phone-shell">
        <main id="appRoot" class="app-root" tabindex="-1">
            <!-- Views are injected here -->
        </main>

        <nav class="bottom-nav" id="bottomNav" aria-label="Main" hidden>
            <div class="bottom-nav__inner">
                <button class="tab" data-route="#/home" data-match="#/home">
                    <span class="icon" aria-hidden="true">🧳</span>
                    <span class="label">MyJourney</span>
                </button>
                <button class="tab" data-route="#/dates" data-match="#/dates #/planner">
                    <span class="icon" aria-hidden="true">🗺️</span>
                    <span class="label">Planner</span>
                </button>

                <!-- 中間浮動新增按鈕 -->
                <button class="fab" id="fabNewPlan" aria-label="New trip">＋</button>

                <button class="tab" data-route="#/map" data-match="#/map">
                    <span class="icon" aria-hidden="true">📍</span>
                    <span class="label">Map</span>
                </button>
                <button class="tab" data-route="#/profile" data-match="#/profile">
                    <span class="icon" aria-hidden="true">👤</span>
                    <span class="label">Profile</span>
                </button>
            </div>
        </nav>

        <!-- AI assistant -->
        <button class="ai-fab" id="aiFab" aria-label="AI suggestions" aria-expanded="false" aria-controls="aiPanel" hidden>
            🤖<span class="dot" aria-hidden="true"></span>
        </button>
        <section class="ai-panel" id="aiPanel" aria-label="AI suggestion" hidden>
            <div class="ai-head">
                <div class="ai-title">AI suggestion</div>
                <div class="ai-wallet" title="AI tokens">🪙 <b id="aiWalletCount">0</b></div>
                <button class="ai-close" id="aiClose" aria-label="Close">✕</button>
            </div>
            <div id="aiSuggestions"></div>
            <div class="ai-foot">
                <button class="btn outline" id="aiClaimBtn">Get daily token (+1)</button>
            </div>
        </section>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
